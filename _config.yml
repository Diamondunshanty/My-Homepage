# Welcome to Junteng Liu's Academic Homepage
#
# This config file is meant for settings that affect your whole site.

# Site Settings
locale                   : "en-US"
title                    : "Junteng Liu"
title_separator          : "-"
name                     : "Junteng Liu"
description              : "Personal academic homepage of Junteng Liu, a first-year PhD candidate at the HKUST NLP Group."
url                      : "https://diamondunshanty.github.io"
baseurl                  : "/My-Homepage"
repository               : "diamondunshanty/My-Homepage"
words_per_minute         : 200

# Site Author
author:
  name             : "Junteng Liu"
  avatar           :
  bio              : "First-year PhD candidate at HKUST NLP Group"
  location         : "Hong Kong"
  email            : "jliugi@connect.ust.hk"
  github           : "Vicent0205"
  googlescholar    : "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  twitter          : "junteng88716710"

# Site Footer
footer:
  links:

# Collections
collections_dir: .
collections:
  publications:
    title: Publications
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/
  posts:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Reading Files
include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - package.json
  - README.md
  - tmp
  - /docs
  - /package.json
  - /talkmap

keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Asia/Hong_Kong
